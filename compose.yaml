services:
  api:
    build:
      context: .
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=pugna;Username=pugna;Password=pugna_dev"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pugna
      POSTGRES_USER: pugna
      POSTGRES_PASSWORD: pugna_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
